[package]
name = "welosaII"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4"
ddp-rs = "1.3.0"
nannou = { version = "0.20.0", features = ["egui", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
rusty_link = "0.4.9"
strum_macros = "0.28.0"
strum = "0.28.0"
egui_plot = "0.35"

[profile.dev.package."*"]
opt-level = 3

